name: Release to Google Play

# v* のタグを push すると署名済み AAB を作って Play の内部テストに上げる。
# 手動実行ならトラックと公開状態を選べる。
#
# 必要な Secrets (Environment "play-release" に登録する)
#   ANDROID_KEYSTORE_BASE64    アップロード鍵の keystore を base64 にしたもの (base64 -i upload.keystore)
#   ANDROID_KEYSTORE_PASSWORD  keystore のパスワード
#   ANDROID_KEY_ALIAS          鍵のエイリアス
#   ANDROID_KEY_PASSWORD       鍵のパスワード
#   GOOGLE_SERVICES_JSON       本番の app/google-services.json の中身
#   PLAY_SERVICE_ACCOUNT_JSON  Play Console でリリース権限を付けたサービスアカウントの JSON キー
#
# versionCode は 2026-01-01 (UTC) からの経過分数を自動で振る。手動アップロードした 1〜8 より
# 必ず大きく、再実行しても被らない。versionName はタグ実行ならタグ名 (先頭の v を除く)、
# 手動実行ならリポジトリの値。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 配信トラック
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 公開状態 (draft は Play Console で手動公開する)
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed AAB and upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play-release

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Restore signing key and Firebase config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_SERVICES_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name が設定されていない"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # app/build.gradle.kts は keystore.properties があるときだけ release 署名する
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decide version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          code=$(( ($(date -u +%s) - $(date -u -d 2026-01-01 +%s)) / 60 ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            echo "name=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Build release bundle
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          args=("-PuoaVersionCode=$VERSION_CODE")
          if [ -n "$VERSION_NAME" ]; then
            args+=("-PuoaVersionName=$VERSION_NAME")
          fi
          ./gradlew bundleRelease "${args[@]}"

      # jarsigner -verify は未署名でも終了コード 0 を返すので、署名ファイルの有無も見る
      - name: Verify bundle is signed
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          if ! unzip -l "$aab" | grep -qE 'META-INF/[^/]+\.(RSA|EC|DSA)$'; then
            echo "::error::$aab が署名されていない"
            exit 1
          fi
          jarsigner -verify "$aab" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.shakenokirimi12.uoa_app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" keystore.properties app/google-services.json
