name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / Unit test / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Gradle のキャッシュとラッパーの検証
      - uses: gradle/actions/setup-gradle@v5

      # google-services プラグインは app/google-services.json が無いとビルドできない。
      # 本物は gitignore 済みなので、CI ではパッケージ名だけ合わせたダミーを置く
      # (FCM は動かないが、ビルドとユニットテストには不要)
      - name: Place dummy google-services.json
        run: cp .github/ci/google-services.dummy.json app/google-services.json

      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --continue

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
